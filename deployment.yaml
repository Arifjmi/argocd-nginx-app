apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: image: 380875918348.dkr.ecr.ap-south-1.amazonaws.com/argocd-ecr-app:latest
        ports:
        - containerPort: 80

